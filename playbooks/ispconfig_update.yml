---
# =============================================================================
# ispconfig_update.yml: update ISPConfig to the latest version, one host at a time
# =============================================================================
# Runs on ispconfig_servers. For each host that is behind (or every host with
# ispconfig_force=true, e.g. after an Ubuntu release upgrade):
#
#   1. reads the state of the web stack (files/web-status.sh)
#   2. downloads the tar.gz and builds the answers file from that version's
#      own sample (tasks/ispconfig_prepare_update.yml)
#   3. LXD snapshot, when the host has lxd_host (tasks/lxd_snapshot.yml)
#   4. runs update.php (tasks/ispconfig_run_update.yml)
#   5. checks the version, that no systemd unit failed and that the
#      services, the panel and every enabled site answer as before; if not,
#      looks again post_recheck_delay seconds later (60) before giving up
#   6. on a failure after the snapshot, restores it (tasks/lxd_restore.yml)
#
# A host that fails stops the run: the next ones are not touched.
#
# The answers are those of ispconfig_update.sh at its prompts by default:
# backup yes, reconfigure services yes, keep the port, no new panel
# certificate, reconfigure crontab. Change single answers with
# ispconfig_update_answers (a dict merged over those, e.g. in host_vars).
# Writes reports/ispconfig-runs/<host>.json.
#
#   ansible-playbook playbooks/ispconfig_update.yml --limit web-01
#   ansible-playbook playbooks/ispconfig_update.yml --limit web-01 -e ispconfig_force=true
#   ansible-playbook playbooks/ispconfig_update.yml --check     # versions only, changes nothing
#
# A multiserver setup must update the master first: list it first, or run
# with --limit. Optional vars: ispconfig_dir, ispconfig_version_url,
# ispconfig_download_url ({version} is replaced), ispconfig_update_timeout
# (1800 s), ispconfig_panel_port (8080), lxd_host / lxd_instance.
# =============================================================================

- name: "Update ISPConfig"
  hosts: ispconfig_servers
  become: true
  gather_facts: false
  serial: 1
  vars:
    ispconfig_force: false
    # The answers of ispconfig_update.sh at its prompts. Change single keys with
    # ispconfig_update_answers in the inventory (merged over these).
    ispconfig_default_answers:
      do_backup: true
      reconfigure_permissions_in_master_database: false
      reconfigure_services: true
      ispconfig_port: default
      create_new_ispconfig_ssl_cert: false
      reconfigure_crontab: true
  tasks:
    - name: Start with an empty result
      ansible.builtin.set_fact:
        ispconfig_run: {status: error, error: null}
        ispconfig_update_output: []
        lxd_snapshot_name: ""
        lxd_restored: false
        lxd_restore_error: ""
        web_problems: []
        post_problems: []
        ispconfig_started_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Versions
      block:
        - name: Installed and latest version
          ansible.builtin.include_tasks: tasks/ispconfig_version.yml
      rescue:
        - name: Versions could not be read
          ansible.builtin.set_fact:
            ispconfig_run:
              status: error
              error: "{{ ansible_failed_result.msg | default('version check failed') | string | truncate(300) }}"

    - name: Decide what to do
      ansible.builtin.set_fact:
        ispconfig_run: >-
          {{ {'status': 'refused',
              'error': 'installed ' ~ ispconfig_installed ~ ' is newer than the published ' ~ ispconfig_latest}
             if ispconfig_state == 'newer'
             else {'status': 'current', 'error': None}
             if ispconfig_state == 'same' and not (ispconfig_force | bool)
             else {'status': 'check_only', 'error': None}
             if ansible_check_mode
             else {'status': 'pending', 'error': None} }}
      when: ispconfig_state is defined

    # A fact of its own: the block's "when" is checked again for every task,
    # rescue included, and ispconfig_run changes inside the block.
    - name: Remember whether to update
      ansible.builtin.set_fact:
        ispconfig_do_update: "{{ ispconfig_run.status == 'pending' }}"

    - name: Update
      when: ispconfig_do_update | bool
      vars:
        ispconfig_target: "{{ ispconfig_latest }}"
      block:
        - name: State of the web stack before
          ansible.builtin.include_tasks: tasks/web_status.yml
          vars:
            web_status_stage: before

        - name: Failed units before
          ansible.builtin.include_tasks: tasks/failed_units.yml
          vars:
            failed_units_stage: before

        # Nothing changes up to here: a failure in these steps restores nothing.
        - name: Download and build the answers file
          ansible.builtin.include_tasks: tasks/ispconfig_prepare_update.yml

        - name: Snapshot
          ansible.builtin.include_tasks: tasks/lxd_snapshot.yml
          vars:
            lxd_snapshot_purpose: ispconfig

        - name: Run the ISPConfig updater
          ansible.builtin.include_tasks: tasks/ispconfig_run_update.yml

        # Services restart while update.php reconfigures them.
        - name: Give the services a moment
          ansible.builtin.pause:
            seconds: 10

        - name: Compare with the state before
          ansible.builtin.include_tasks: tasks/post_checks.yml

        - name: Stop if something that worked before doesn't now
          ansible.builtin.fail:
            msg: "After the update: {{ post_problems | join('; ') }}"
          when: post_problems | length > 0

        - name: Updated
          ansible.builtin.set_fact:
            ispconfig_run: {status: updated, error: null}

        - name: Delete older snapshots of this playbook
          ansible.builtin.include_tasks: tasks/lxd_snapshot_prune.yml
          vars:
            lxd_snapshot_purpose: ispconfig

      rescue:
        - name: Keep the error
          ansible.builtin.set_fact:
            ispconfig_run:
              status: failed
              error: >-
                {{ ((ansible_failed_task.name | default('') ~ ': ' if ansible_failed_task is defined else '')
                    ~ (ansible_failed_result.msg | default('update failed') | string)
                    ~ ((' (' ~ ((ansible_failed_result.stderr | trim).splitlines() | last) ~ ')')
                       if ansible_failed_result.stderr | default('') | trim else '')) | truncate(500) }}

        - name: Go back to the snapshot
          ansible.builtin.include_tasks: tasks/lxd_restore.yml

    - name: Create the report directory on the controller
      ansible.builtin.file:
        path: "{{ patch_report_dir }}/ispconfig-runs"
        state: directory
        mode: "{{ patch_report_dir_mode | default('2750') }}"
      delegate_to: localhost
      check_mode: false
      vars:
        ansible_become: false
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: patch_report_enabled | default(true) | bool

    - name: Write the report on the controller
      ansible.builtin.copy:
        content: "{{ report | to_nice_json }}\n"
        dest: "{{ patch_report_dir }}/ispconfig-runs/{{ inventory_hostname }}.json"
        mode: "{{ patch_report_file_mode | default('0640') }}"
      delegate_to: localhost
      check_mode: false
      vars:
        ansible_become: false
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        report:
          host: "{{ inventory_hostname }}"
          started_at: "{{ ispconfig_started_at }}"
          finished_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          # updated | current | check_only | refused | failed | error
          status: "{{ ispconfig_run.status }}"
          from_version: "{{ ispconfig_installed | default(None) or None }}"
          to_version: "{{ ispconfig_latest | default(None) or None }}"
          forced: "{{ ispconfig_force | bool }}"
          error: "{{ ispconfig_run.error }}"
          problems: "{{ post_problems }}"
          snapshot: "{{ lxd_snapshot_name or None }}"
          restored: "{{ lxd_restored }}"
          restore_error: "{{ lxd_restore_error or None }}"
          output_tail: "{{ ispconfig_update_output or None }}"
      when: patch_report_enabled | default(true) | bool

    - name: Fail the host if the update didn't go through
      ansible.builtin.fail:
        msg: >-
          {{ ispconfig_run.error }}{{ ' Restored to ' ~ lxd_snapshot_name ~ '.' if lxd_restored else '' }}
          {{- (' Restore failed: ' ~ lxd_restore_error) if lxd_restore_error else '' }}
      when: ispconfig_run.status in ['failed', 'error', 'refused']
