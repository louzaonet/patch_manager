---
# First half of an ISPConfig update, which changes nothing on the host:
# downloads ispconfig_target (a version) into a temporary directory and
# builds the answers file for update.php. tasks/ispconfig_run_update.yml runs
# it and removes the directory. Sets ispconfig_tmp. On failure the directory
# is removed here and the error goes up.
#
# Integrity: TLS to ispconfig.org, plus a sha256 per version. ISPConfig
# publishes none, so the first download of each version pins its sha256 on
# the controller (reports/ispconfig-sha256.json) and every later download of
# that version, on any host, must match it (trust on first use; turn it off
# with ispconfig_sha256_pin: false). A sum you give in ispconfig_sha256
# ({"3.3.3p2": "<sha256>"}) wins over the pinned one;
# ispconfig_require_sha256: true refuses a version that is in neither.
#
# The answers file is built on the host from the sample in the downloaded
# tar.gz (files/ispconfig_autoupdate.py), with ispconfig_default_answers
# (set by the playbook) and ispconfig_update_answers merged over them.
# The MariaDB root password is "default": update.php reads it from
# server/lib/mysql_clientdb.conf, so it never leaves the host.

- name: Prepare the update
  block:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
        suffix: .ispconfig
      register: ispconfig_tmp

    - name: Read the checksums pinned by earlier downloads
      ansible.builtin.slurp:
        src: "{{ ispconfig_pin_file }}"
      register: ispconfig_pins_raw
      failed_when: false
      delegate_to: localhost
      vars: &ispconfig_controller
        ansible_become: false
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: ispconfig_sha256_pin | default(true) | bool

    # A pin file that is not valid JSON stops the update (rescue below): it
    # is the record the downloads are checked against.
    - name: Pick the checksum this download must have
      ansible.builtin.set_fact:
        ispconfig_pins: "{{ pins }}"
        ispconfig_expected_sha256: >-
          {{ (ispconfig_sha256 | default({}))[ispconfig_target]
             | default(pins[ispconfig_target] | default('')) | lower }}
        ispconfig_sha256_source: >-
          {{ 'ispconfig_sha256' if ispconfig_target in (ispconfig_sha256 | default({}))
             else 'pinned' if ispconfig_target in pins else 'none' }}
      vars:
        pins: >-
          {{ (ispconfig_pins_raw.content | b64decode | from_json)
             if (ispconfig_pins_raw.content | default('')) else {} }}

    - name: Stop if a checksum is required and there is none for this version
      ansible.builtin.fail:
        msg: >-
          ispconfig_require_sha256 is set and there is no sha256 for {{ ispconfig_target }}
          (neither in ispconfig_sha256 nor pinned). Add it to ispconfig_sha256 after checking the file.
      when:
        - ispconfig_require_sha256 | default(false) | bool
        - not ispconfig_expected_sha256

    - name: "Download ISPConfig {{ ispconfig_target }}"
      ansible.builtin.get_url:
        url: >-
          {{ ispconfig_download_url | default('https://www.ispconfig.org/downloads/ISPConfig-{version}.tar.gz')
             | replace('{version}', ispconfig_target) }}
        dest: "{{ ispconfig_tmp.path }}/ispconfig.tar.gz"
        mode: "0600"
        timeout: 120
        checksum: "{{ ('sha256:' ~ ispconfig_expected_sha256) if ispconfig_expected_sha256 else omit }}"

    - name: Checksum of the download
      ansible.builtin.stat:
        path: "{{ ispconfig_tmp.path }}/ispconfig.tar.gz"
        checksum_algorithm: sha256
        get_checksum: true
      register: ispconfig_download

    - name: Pin the checksum of a version downloaded for the first time
      ansible.builtin.copy:
        content: "{{ ispconfig_pins | combine({ispconfig_target: ispconfig_download.stat.checksum}) | to_nice_json }}\n"
        dest: "{{ ispconfig_pin_file }}"
        mode: "{{ patch_report_file_mode | default('0640') }}"
      delegate_to: localhost
      vars: *ispconfig_controller
      when:
        - ispconfig_sha256_pin | default(true) | bool
        - ispconfig_sha256_source == 'none'

    - name: Unpack it
      ansible.builtin.unarchive:
        src: "{{ ispconfig_tmp.path }}/ispconfig.tar.gz"
        dest: "{{ ispconfig_tmp.path }}"
        remote_src: true

    - name: Copy the answers file builder
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/ispconfig_autoupdate.py"
        dest: "{{ ispconfig_tmp.path }}/ispconfig_autoupdate.py"
        mode: "0700"

    - name: Build the answers file from this version's sample
      ansible.builtin.command:
        argv:
          - python3
          - "{{ ispconfig_tmp.path }}/ispconfig_autoupdate.py"
          - ini
          - --sample
          - "{{ ispconfig_tmp.path }}/ispconfig3_install/docs/autoinstall_samples/autoinstall.ini.sample"
          - --out
          - "{{ ispconfig_tmp.path }}/autoupdate.ini"
          - --answers
          - "{{ ispconfig_default_answers | default({}) | combine(ispconfig_update_answers | default({})) | to_json }}"
      changed_when: false

  rescue:
    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ ispconfig_tmp.path }}"
        state: absent
      when: ispconfig_tmp.path is defined

    - name: Preparing the update failed
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default('failed') }}
          {{- (' (' ~ ((ansible_failed_result.stderr | trim).splitlines() | last) ~ ')')
              if ansible_failed_result.stderr | default('') | trim else '' }}
