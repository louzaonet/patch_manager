---
# =============================================================================
# check_updates.yml: detect pending updates (installs nothing)
# =============================================================================
# Writes one JSON report per host to {{ patch_report_dir }}/hosts/ on the
# controller. The AI service reads those files for risk scoring.
#
#   ansible-playbook playbooks/check_updates.yml
#   ansible-playbook playbooks/check_updates.yml --limit ubuntu_servers
# =============================================================================

# ─── Ubuntu ─────────────────────────────────────────────────────────────────
- name: "Check pending updates: Ubuntu"
  hosts: ubuntu_servers
  become: true
  gather_facts: true
  tasks:
    - name: Refresh APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: List upgradable packages
      ansible.builtin.command: apt list --upgradable
      environment:
        LC_ALL: C
      register: apt_upgradable
      changed_when: false

    - name: Check if a reboot is pending
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    # Lines look like: "openssl/noble-updates,noble-security 3.0.13-0ubuntu3.5 amd64 [upgradable from: ...]"
    - name: Build host report
      ansible.builtin.set_fact:
        host_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          os_group: ubuntu_servers
          os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          checked_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          update_count: "{{ upgradable | length }}"
          security_count: "{{ security | length }}"
          packages: "{{ upgradable | map('regex_replace', '/.*$', '') | list }}"
          security_packages: "{{ security | map('regex_replace', '/.*$', '') | list }}"
          cves: []
          reboot_required: "{{ reboot_flag.stat.exists }}"
      vars:
        upgradable: "{{ apt_upgradable.stdout_lines | select('search', '\\[upgradable from') | list }}"
        security: "{{ upgradable | select('search', '^[^ ]+/[^ ]*-security') | list }}"

# ─── Rocky Linux ────────────────────────────────────────────────────────────
- name: "Check pending updates: Rocky Linux"
  hosts: rocky_servers
  become: true
  gather_facts: true
  tasks:
    # dnf exits 100 when updates are available
    - name: List available updates
      ansible.builtin.command: dnf -q check-update
      register: dnf_updates
      changed_when: false
      failed_when: dnf_updates.rc not in [0, 100]

    - name: List security advisories with their CVEs
      ansible.builtin.command: dnf -q updateinfo list --security --with-cve
      register: dnf_cves
      changed_when: false
      failed_when: false

    - name: List security advisories by package
      ansible.builtin.command: dnf -q updateinfo list --security
      register: dnf_security
      changed_when: false
      failed_when: false

    # rc 1 = reboot needed. Needs dnf-plugins-core (installed by default on Rocky 9/10).
    - name: Check if a reboot is pending
      ansible.builtin.command: dnf needs-restarting -r
      register: needs_restarting
      changed_when: false
      failed_when: false

    # check-update lines: "openssl.x86_64  1:3.2.2-6.el10  baseos"
    - name: Build host report
      ansible.builtin.set_fact:
        host_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          os_group: rocky_servers
          os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          checked_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          update_count: "{{ pkg_lines | length }}"
          security_count: "{{ sec_pkgs | length }}"
          packages: "{{ pkg_lines | map('regex_replace', '^(\\S+)\\.\\S+\\s.*$', '\\1') | list }}"
          security_packages: "{{ sec_pkgs }}"
          cves: "{{ dnf_cves.stdout | regex_findall('CVE-\\d{4}-\\d{4,}') | unique | list }}"
          reboot_required: "{{ needs_restarting.rc == 1 }}"
      vars:
        # Everything after "Obsoleting Packages" repeats packages already listed.
        pkg_lines: "{{ dnf_updates.stdout.split('Obsoleting Packages')[0].splitlines() | select('match', '^\\S+\\.\\S+\\s+\\S+\\s+\\S+\\s*$') | list }}"
        # "RLSA-2026:1234 Important/Sec. openssl-1:3.2.2-6.el10.x86_64" -> openssl
        sec_pkgs: >-
          {{ dnf_security.stdout
             | regex_findall('^\S+\s+\S+\s+(\S+)\s*$', multiline=True)
             | map('regex_replace', '-[^-]+-[^-]+$', '') | unique | list }}

# ─── macOS ──────────────────────────────────────────────────────────────────
- name: "Check pending updates: macOS"
  hosts: macos_servers
  become: true
  gather_facts: true
  tasks:
    # Output (macOS 13+):
    #   * Label: macOS Tahoe 26.1-25B78
    #   	Title: macOS Tahoe 26.1, Version: 26.1, Size: ..., Recommended: YES, Action: restart,
    - name: List available updates
      ansible.builtin.command: softwareupdate --list
      register: su_list
      changed_when: false

    - name: Build host report
      ansible.builtin.set_fact:
        host_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          os_group: macos_servers
          os: "macOS {{ ansible_facts['distribution_version'] | default('') }}"
          checked_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          update_count: "{{ labels | length }}"
          security_count: "{{ recommended | length }}"
          packages: "{{ labels }}"
          security_packages: "{{ recommended }}"
          cves: []
          reboot_required: false
          restart_on_install: "{{ 'Action: restart' in su_list.stdout }}"
      vars:
        labels: "{{ su_list.stdout_lines | select('match', '^\\s*\\* Label: ') | map('regex_replace', '^\\s*\\* Label: ', '') | list }}"
        recommended: "{{ su_list.stdout | regex_findall('Title: ([^,]+),[^\\n]*Recommended: YES') }}"

# ─── Windows ────────────────────────────────────────────────────────────────
- name: "Check pending updates: Windows"
  hosts: windows_servers
  gather_facts: true
  tasks:
    - name: Search for updates
      ansible.windows.win_updates:
        category_names: "{{ patch_windows_categories }}"
        reject_list: "{{ patch_windows_reject_list }}"
        state: searched
      register: win_search

    - name: Build host report
      ansible.builtin.set_fact:
        host_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          os_group: windows_servers
          os: "{{ ansible_facts['os_name'] | default('Windows') }}"
          checked_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          update_count: "{{ updates | length }}"
          security_count: "{{ security | length }}"
          packages: "{{ updates | map(attribute='title') | list }}"  # noqa: jinja[invalid] (lint mocks values as str; str.title)
          security_packages: "{{ security | map(attribute='title') | list }}"  # noqa: jinja[invalid]
          cves: []
          reboot_required: "{{ win_search.reboot_required | default(ansible_facts['reboot_pending'] | default(false)) }}"
      vars:
        updates: "{{ win_search.updates | default({}) | dict2items | map(attribute='value') | list }}"
        with_categories: "{{ updates | selectattr('categories', 'defined') | list }}"
        security: >-
          {{ ((with_categories | selectattr('categories', 'contains', 'Security Updates') | list)
              + (with_categories | selectattr('categories', 'contains', 'Critical Updates') | list))
             | unique | list }}

# ─── Write reports and send the summary ────────────────────────────────────
# Runs on "all" (not localhost) so it still executes when --limit is used;
# controller-side work is delegated to localhost.
- name: "Write host reports and send summary"
  hosts: all
  gather_facts: false
  tasks:
    - name: Create report directories on the controller
      ansible.builtin.file:
        path: "{{ patch_report_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [hosts, patch-runs]
      delegate_to: localhost
      run_once: true
      vars: &controller_vars
        ansible_become: false
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: patch_report_enabled | bool

    - name: Write JSON report on the controller
      ansible.builtin.copy:
        content: "{{ host_report | to_nice_json }}\n"
        dest: "{{ patch_report_dir }}/hosts/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
      vars: *controller_vars
      when:
        - patch_report_enabled | bool
        - host_report is defined

    - name: Send summary email
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        username: "{{ smtp_user | default(omit, true) }}"
        password: "{{ smtp_password | default(omit, true) }}"
        secure: "{{ smtp_secure }}"
        from: "{{ email_from }}"
        to: "{{ email_to }}"
        subject: "{{ email_subject_prefix }} Pending updates report {{ now().strftime('%Y-%m-%d') }}"
        subtype: html
        body: "{{ lookup('ansible.builtin.template', 'pending_updates_email.html.j2') }}"
      delegate_to: localhost
      run_once: true
      vars:
        <<: *controller_vars
        patch_summary: >-
          {{ ansible_play_hosts_all | map('extract', hostvars)
             | selectattr('host_report', 'defined') | map(attribute='host_report') | list }}
      when:
        - email_enabled | bool
        - patch_summary | length > 0
