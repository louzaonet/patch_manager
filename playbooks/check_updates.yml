---
# =============================================================================
# check_updates.yml: detect pending updates (installs nothing)
# =============================================================================
# Writes one JSON report per host to {{ patch_report_dir }}/hosts/ on the
# controller. The AI service reads those files for risk scoring. Ubuntu and
# Rocky hosts also get their installed package list in packages/<host>.json
# (turn off with patch_collect_packages: false).
#
# Ubuntu reports carry the CVEs their pending updates fix: the controller
# checks the package list and the running kernel against Canonical's USN OVAL
# data (files/ubuntu_oval_cves.py; turn off with patch_ubuntu_cves: false).
#
#   ansible-playbook playbooks/check_updates.yml
#   ansible-playbook playbooks/check_updates.yml --limit ubuntu_servers
#
# Every play sets check_mode: false. This playbook only reads the hosts, and
# under --check (Semaphore's "Dry Run" box) the listing commands would be
# skipped and the reports could not be built.
# =============================================================================

# ─── Ubuntu ─────────────────────────────────────────────────────────────────
- name: "Check pending updates: Ubuntu"
  hosts: ubuntu_servers
  become: true
  gather_facts: true
  check_mode: false
  tasks:
    - name: Refresh APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: List upgradable packages
      ansible.builtin.command: apt list --upgradable
      environment:
        LC_ALL: C
      register: apt_upgradable
      changed_when: false

    # Which of them are security updates: an upgrade simulated with the
    # -security pocket preferred, as apply_patches.yml installs them. Taking
    # the pocket of the candidate in "apt list" missed a fix in -security when
    # -updates had a newer version.
    - name: List the security updates (simulated, -security preferred)
      ansible.builtin.command:
        argv: [apt-get, -s, -o, Debug::NoLocking=1, -t, "{{ ansible_facts['distribution_release'] }}-security", dist-upgrade]
      environment:
        LC_ALL: C
      register: apt_security_sim
      changed_when: false

    # Installed packages, for "which version of X do we have?" in the AI
    # service. Only lines in state "ii" (installed) are kept.
    - name: List installed packages
      ansible.builtin.command:
        argv: [dpkg-query, --show, '--showformat=${db:Status-Abbrev}\t${Package}\t${Version}\n']
      register: installed_pkgs
      changed_when: false
      when: patch_collect_packages | default(true) | bool

    # name -> version; several installed versions (kernels) are joined with ", ".
    - name: Keep the installed package list
      ansible.builtin.set_fact:
        host_packages: >-
          {%- set out = {} -%}
          {%- for line in installed_pkgs.stdout_lines | select('match', '^ii\s') -%}
          {%- set f = line.split('\t') -%}
          {%- if f | length >= 3 and f[1] and f[2] -%}
          {%- set _ = out.update({f[1]: f[2] if (f[1] not in out or out[f[1]] == f[2]) else out[f[1]] ~ ', ' ~ f[2]}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
      when: installed_pkgs.stdout_lines is defined

    - name: Check if a reboot is pending
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    # The release do-release-upgrade would go to, following the host's
    # /etc/update-manager/release-upgrades (Prompt=lts, normal or never).
    # LTS to LTS is only offered once the first point release is out. It
    # prints "New release '24.04.3 LTS' available." and changes nothing.
    - name: Check whether a new Ubuntu release is offered
      ansible.builtin.command:
        argv: [timeout, "{{ patch_release_check_timeout | default(60) }}", do-release-upgrade, --check-dist-upgrade-only]
      environment:
        LC_ALL: C
      register: release_check
      changed_when: false
      failed_when: false
      when: patch_release_check | default(true) | bool

    # Lines look like: "openssl/noble-updates,noble-security 3.0.13-0ubuntu3.5 amd64 [upgradable from: ...]"
    - name: Build host report
      ansible.builtin.set_fact:
        host_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          os_group: ubuntu_servers
          os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          os_codename: "{{ ansible_facts['distribution_release'] }}"
          kernel: "{{ ansible_facts['kernel'] }}"   # running kernel (uname -r)
          checked_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          update_count: "{{ upgradable | length }}"
          security_count: "{{ security | length }}"
          packages: "{{ upgradable | map('regex_replace', '/.*$', '') | list }}"
          security_packages: "{{ security }}"
          cves: []   # filled on the controller from the OVAL data, see the last play
          reboot_required: "{{ reboot_flag.stat.exists }}"
          # e.g. "26.04.1 LTS"; null when none is offered. release_check_error
          # when it could not be checked (no do-release-upgrade, no network).
          release_upgrade_to: "{{ offered[0] if offered else None }}"
          release_check_error: >-
            {{ None if not (patch_release_check | default(true) | bool) or offered
               else 'could not reach the Ubuntu release list (changelogs.ubuntu.com)'
                    if 'Failed to connect' in release_text
               else None if release_check.rc | default(0) in [0, 1]
               else 'do-release-upgrade not installed (package ubuntu-release-upgrader-core)'
                    if release_check.rc == 127
               else 'timed out' if release_check.rc == 124
               else ((release_check.stderr | default('', true) | trim).splitlines() | last
                     | default('rc ' ~ release_check.rc))[-200:] }}
      vars:
        upgradable: "{{ apt_upgradable.stdout_lines | select('search', '\\[upgradable from') | list }}"
        # rc is 0 with a release to offer and 1 without one, but also 1 when
        # the list can't be downloaded: the text tells them apart.
        release_text: "{{ (release_check.stdout | default('')) ~ '\n' ~ (release_check.stderr | default('')) }}"
        offered: "{{ release_text | regex_findall(\"New release '([^']+)' available\") }}"
        # "Inst pkg [installed] (new Ubuntu:24.04/noble-updates, Ubuntu:24.04/noble-security [amd64])"
        security: >-
          {{ apt_security_sim.stdout_lines | select('match', '^Inst \S+ \[')
             | select('search', '\(\S+ [^)]*-security') | map('regex_replace', '^Inst ([^ :]+).*$', '\1') | unique | list }}

# ─── Rocky Linux ────────────────────────────────────────────────────────────
- name: "Check pending updates: Rocky Linux"
  hosts: rocky_servers
  become: true
  gather_facts: true
  check_mode: false
  tasks:
    # dnf exits 100 when updates are available
    - name: List available updates
      ansible.builtin.command: dnf -q check-update
      register: dnf_updates
      changed_when: false
      failed_when: dnf_updates.rc not in [0, 100]

    - name: List security advisories with their CVEs
      ansible.builtin.command: dnf -q updateinfo list --security --with-cve
      register: dnf_cves
      changed_when: false
      failed_when: false

    - name: List security advisories by package
      ansible.builtin.command: dnf -q updateinfo list --security
      register: dnf_security
      changed_when: false
      failed_when: false

    # rc 1 means "reboot needed", but dnf also exits 1 on any error, including
    # a missing needs-restarting plugin (dnf-plugins-core). The message is
    # checked too, so an error is never read as a pending reboot.
    - name: Check if a reboot is pending
      ansible.builtin.command: dnf needs-restarting -r
      environment:
        LC_ALL: C
      register: needs_restarting
      changed_when: false
      failed_when: false

    # Same "ii<TAB>name<TAB>version" lines as dpkg-query on Ubuntu.
    - name: List installed packages
      ansible.builtin.command:
        argv: [rpm, -qa, --queryformat, 'ii\t%{NAME}\t%{VERSION}-%{RELEASE}\n']
      register: installed_pkgs
      changed_when: false
      when: patch_collect_packages | default(true) | bool

    # name -> version; several installed versions (kernels) are joined with ", ".
    - name: Keep the installed package list
      ansible.builtin.set_fact:
        host_packages: >-
          {%- set out = {} -%}
          {%- for line in installed_pkgs.stdout_lines | select('match', '^ii\s') -%}
          {%- set f = line.split('\t') -%}
          {%- if f | length >= 3 and f[1] and f[2] -%}
          {%- set _ = out.update({f[1]: f[2] if (f[1] not in out or out[f[1]] == f[2]) else out[f[1]] ~ ', ' ~ f[2]}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
      when: installed_pkgs.stdout_lines is defined

    # check-update lines: "openssl.x86_64  1:3.2.2-6.el10  baseos"
    - name: Build host report
      ansible.builtin.set_fact:
        host_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          os_group: rocky_servers
          os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          checked_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          update_count: "{{ pkg_lines | length }}"
          security_count: "{{ sec_pkgs | length }}"
          packages: "{{ pkg_lines | map('regex_replace', '^(\\S+)\\.\\S+\\s.*$', '\\1') | list }}"
          security_packages: "{{ sec_pkgs }}"
          cves: "{{ dnf_cves.stdout | regex_findall('CVE-\\d{4}-\\d{4,}') | unique | list }}"
          reboot_required: "{{ needs_restarting.rc == 1 and 'Reboot is required' in needs_restarting.stdout }}"
      vars:
        # Everything after "Obsoleting Packages" repeats packages already listed.
        pkg_lines: "{{ dnf_updates.stdout.split('Obsoleting Packages')[0].splitlines() | select('match', '^\\S+\\.\\S+\\s+\\S+\\s+\\S+\\s*$') | list }}"
        # "RLSA-2026:1234 Important/Sec. openssl-1:3.2.2-6.el10.x86_64" -> openssl
        sec_pkgs: >-
          {{ dnf_security.stdout
             | regex_findall('^\S+\s+\S+\s+(\S+)\s*$', multiline=True)
             | map('regex_replace', '-[^-]+-[^-]+$', '') | unique | list }}

# ─── macOS ──────────────────────────────────────────────────────────────────
- name: "Check pending updates: macOS"
  hosts: macos_servers
  become: true
  gather_facts: true
  check_mode: false
  tasks:
    # Output (macOS 13+):
    #   * Label: macOS Tahoe 26.1-25B78
    #   	Title: macOS Tahoe 26.1, Version: 26.1, Size: ..., Recommended: YES, Action: restart,
    - name: List available updates
      ansible.builtin.command: softwareupdate --list
      register: su_list
      changed_when: false

    - name: Build host report
      ansible.builtin.set_fact:
        host_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          os_group: macos_servers
          os: "macOS {{ ansible_facts['distribution_version'] | default('') }}"
          checked_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          update_count: "{{ labels | length }}"
          # An approximation: softwareupdate has no security flag, and
          # "Recommended: YES" also covers updates that fix no vulnerability.
          security_count: "{{ recommended | length }}"
          packages: "{{ labels }}"
          security_packages: "{{ recommended }}"
          cves: []
          reboot_required: false
          restart_on_install: "{{ 'Action: restart' in su_list.stdout }}"
      vars:
        labels: "{{ su_list.stdout_lines | select('match', '^\\s*\\* Label: ') | map('regex_replace', '^\\s*\\* Label: ', '') | list }}"
        recommended: "{{ su_list.stdout | regex_findall('Title: ([^,]+),[^\\n]*Recommended: YES') }}"

# ─── Windows ────────────────────────────────────────────────────────────────
- name: "Check pending updates: Windows"
  hosts: windows_servers
  gather_facts: true
  check_mode: false
  tasks:
    - name: Search for updates
      ansible.windows.win_updates:
        category_names: "{{ patch_windows_categories }}"
        reject_list: "{{ patch_windows_reject_list }}"
        state: searched
      register: win_search

    - name: Build host report
      ansible.builtin.set_fact:
        host_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          os_group: windows_servers
          os: "{{ ansible_facts['os_name'] | default('Windows') }}"
          checked_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          update_count: "{{ updates | length }}"
          security_count: "{{ security | length }}"
          packages: "{{ updates | map(attribute='title') | list }}"  # noqa: jinja[invalid] (lint mocks values as str; str.title)
          security_packages: "{{ security | map(attribute='title') | list }}"  # noqa: jinja[invalid]
          cves: []
          reboot_required: "{{ win_search.reboot_required | default(ansible_facts['reboot_pending'] | default(false)) }}"
      vars:
        updates: "{{ win_search.updates | default({}) | dict2items | map(attribute='value') | list }}"
        with_categories: "{{ updates | selectattr('categories', 'defined') | list }}"
        security: >-
          {{ ((with_categories | selectattr('categories', 'contains', 'Security Updates') | list)
              + (with_categories | selectattr('categories', 'contains', 'Critical Updates') | list))
             | unique | list }}

# ─── Write reports and send the summary ────────────────────────────────────
# Runs on "all" (not localhost) so it still executes when --limit is used;
# controller-side work is delegated to localhost.
- name: "Write host reports and send summary"
  hosts: all
  gather_facts: false
  check_mode: false
  tasks:
    - name: Create report directories on the controller
      ansible.builtin.file:
        path: "{{ patch_report_dir }}/{{ item }}"
        state: directory
        mode: "{{ patch_report_dir_mode | default('2750') }}"
      loop: [hosts, patch-runs, packages]
      delegate_to: localhost
      run_once: true
      vars: &controller_vars
        ansible_become: false
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: patch_report_enabled | bool

    # Compact JSON: a host has one to two thousand packages.
    - name: Write the installed package list on the controller
      ansible.builtin.copy:
        content: "{{ package_report | to_json }}\n"
        dest: "{{ patch_report_dir }}/packages/{{ inventory_hostname }}.json"
        mode: "{{ patch_report_file_mode | default('0640') }}"
      delegate_to: localhost
      vars:
        <<: *controller_vars
        package_report:
          schema: 1
          host: "{{ inventory_hostname }}"
          collected_at: "{{ host_report.checked_at | default(now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ')) }}"
          packages: "{{ host_packages }}"
      when:
        - patch_report_enabled | bool
        - host_packages is defined

    # One run for every Ubuntu host of the play, after their package lists are
    # written. It downloads the OVAL file of each release only when it changed
    # and never fails the play: problems end up as cve_error in the report.
    # --unfixed also reads the CVE OVAL (5-14 MB per release) for the CVEs
    # with no fix yet (patch_ubuntu_unfixed_cves: false to skip it).
    - name: Find the CVEs fixed by pending Ubuntu updates (Canonical OVAL)
      ansible.builtin.command:
        argv: >-
          {{ [ansible_playbook_python, playbook_dir ~ '/files/ubuntu_oval_cves.py',
              '--cache-dir', patch_oval_cache_dir | default(patch_report_dir ~ '/oval-cache'),
              '--packages-dir', patch_report_dir ~ '/packages',
              '--url-base', patch_oval_url_base | default('https://security-metadata.canonical.com/oval')]
             + (['--unfixed'] if patch_ubuntu_unfixed_cves | default(true) | bool else []) }}
        stdin: "{{ oval_hosts | to_json }}"
      register: oval_run
      changed_when: false
      failed_when: false
      delegate_to: localhost
      run_once: true
      vars:
        <<: *controller_vars
        oval_hosts: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts_all -%}
          {%- set r = hostvars[h].host_report | default({}) -%}
          {%- if r.os_group | default('') == 'ubuntu_servers' -%}
          {%- set _ = out.append({'host': h, 'codename': r.os_codename | default(''),
                                  'kernel': r.kernel | default(''),
                                  'checked_at': r.checked_at | default(''),
                                  'security_packages': r.security_packages | default([])}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
      when:
        - patch_report_enabled | bool
        - patch_ubuntu_cves | default(true) | bool
        - oval_hosts | length > 0

    # Parsed in its own task: invalid JSON (a cut output) inside the report
    # template would fail the report of every host.
    - name: Read the OVAL result
      when:
        - patch_report_enabled | bool
        - host_report is defined
      block:
        - name: Parse it
          ansible.builtin.set_fact:
            oval: >-
              {{ oval_run.stdout | from_json
                 if (oval_run.rc | default(1)) == 0 and (oval_run.stdout | default('')).startswith('{')
                 else {} }}
      rescue:
        - name: Not valid JSON
          ansible.builtin.set_fact:
            oval: {}
            oval_parse_error: "the OVAL step printed invalid JSON"

    - name: Write JSON report on the controller
      ansible.builtin.copy:
        content: "{{ host_report | combine(cve_fields) | to_nice_json }}\n"
        dest: "{{ patch_report_dir }}/hosts/{{ inventory_hostname }}.json"
        mode: "{{ patch_report_file_mode | default('0640') }}"
      delegate_to: localhost
      vars:
        <<: *controller_vars
        cve_fields: >-
          {%- if host_report.os_group | default('') != 'ubuntu_servers'
                 or not (patch_ubuntu_cves | default(true) | bool) -%}
          {{ {} }}
          {%- elif inventory_hostname in (oval.hosts | default({})) -%}
          {{ oval.hosts[inventory_hostname] }}
          {%- else -%}
          {{ {'cve_source': None,
              'cve_error': (oval.errors | default({}))[inventory_hostname]
                           | default(oval_parse_error | default('', true)
                                     or ((oval_run.stderr | default('', true) | trim
                                          or 'OVAL step did not run').splitlines() | last)[-300:], true)} }}
          {%- endif -%}
      when:
        - patch_report_enabled | bool
        - host_report is defined

    - name: Send summary email
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        username: "{{ smtp_user | default(omit, true) }}"
        password: "{{ smtp_password | default(omit, true) }}"
        # "try" with a login would fall back to sending the password in clear.
        secure: "{{ 'starttls' if smtp_user and smtp_secure == 'try' else smtp_secure }}"
        from: "{{ email_from }}"
        to: "{{ email_to }}"
        subject: "{{ email_subject_prefix }} Pending updates report {{ now().strftime('%Y-%m-%d') }}"
        subtype: html
        body: "{{ lookup('ansible.builtin.template', 'pending_updates_email.html.j2') }}"
      delegate_to: localhost
      run_once: true
      vars:
        <<: *controller_vars
        patch_summary: >-
          {{ ansible_play_hosts_all | map('extract', hostvars)
             | selectattr('host_report', 'defined') | map(attribute='host_report') | list }}
      when:
        - email_enabled | bool
        - patch_summary | length > 0
