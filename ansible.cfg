[defaults]
inventory = inventory/hosts.yml
forks = 20
timeout = 30
retry_files_enabled = False
# The community.general.yaml callback was removed in community.general 12.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.cache/ansible/facts
fact_caching_timeout = 3600
# Playbooks use ansible_facts['...'] only. The old injected variables
# (ansible_distribution, ...) are deprecated since ansible-core 2.20.
inject_facts_as_vars = False
# Trust on first use: new host keys are accepted and remembered, changed
# keys are rejected. Pre-seed ~/.ssh/known_hosts for stricter control.
host_key_checking = True

[privilege_escalation]
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[persistent_connection]
connect_timeout = 30
command_timeout = 30
