---
# =============================================================================
# Inventory: Patch Manager
# =============================================================================
# The four OS groups below drive which play runs on a host. Put hosts in
# exactly one of them; nested groups (children) are fine.
#
# patch_criticality (high | medium | low, default medium) feeds the AI risk
# score. Secrets: never in plain text. Use Vault, e.g.
#   ansible-vault encrypt_string 'secret' --name vault_windows_password
# =============================================================================

all:
  children:

    # ─── Ubuntu ─────────────────────────────────────────────────────────
    ubuntu_servers:
      hosts:
        ubuntu-web-01:
          ansible_host: 192.168.1.10
        ubuntu-web-02:
          ansible_host: 192.168.1.11
        ubuntu-db-01:
          ansible_host: 192.168.1.20
          patch_criticality: high
      vars:
        ansible_user: ansible
        ansible_python_interpreter: /usr/bin/python3

    # ─── Rocky Linux ────────────────────────────────────────────────────
    rocky_servers:
      hosts:
        rocky-app-01:
          ansible_host: 192.168.1.30
        rocky-app-02:
          ansible_host: 192.168.1.31
      vars:
        ansible_user: ansible
        ansible_python_interpreter: /usr/bin/python3

    # ─── macOS ──────────────────────────────────────────────────────────
    macos_servers:
      hosts:
        mac-build-01:
          ansible_host: 192.168.1.50
        mac-build-02:
          ansible_host: 192.168.1.51
      vars:
        ansible_user: admin
        # Requires the Xcode Command Line Tools (provides /usr/bin/python3)
        ansible_python_interpreter: /usr/bin/python3

    # ─── Windows 10 / 11 ────────────────────────────────────────────────
    # Windows 10 only gets security updates when enrolled in ESU.
    windows_servers:
      hosts:
        win-desktop-01:
          ansible_host: 192.168.1.70
        win-desktop-02:
          ansible_host: 192.168.1.71
        win-server-01:
          ansible_host: 192.168.1.80
          patch_criticality: high
      vars:
        ansible_user: ansible_admin
        ansible_password: "{{ vault_windows_password }}"
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_scheme: https
        # Kerberos is preferable in a domain (pip install pywinrm[kerberos]).
        ansible_winrm_transport: ntlm
        # The setup script creates a self-signed listener certificate. If you
        # deploy certificates from your CA, change this to "validate".
        ansible_winrm_server_cert_validation: ignore

    # ─── Logical groups (scheduling, --limit) ───────────────────────────
    production:
      children:
        ubuntu_servers:
        rocky_servers:

    workstations:
      children:
        macos_servers:
        windows_servers:
