---
# =============================================================================
# Inventory: Patch Manager
# =============================================================================
# The four OS groups below drive which play runs on a host. Put hosts in
# exactly one of them; nested groups (children) are fine.
#
# patch_criticality (high | medium | low, default medium) feeds the AI risk
# score. Secrets: never in plain text. Use Vault, e.g.
#   ansible-vault encrypt_string 'secret' --name vault_windows_password
# =============================================================================

all:
  children:

    # ─── Ubuntu ─────────────────────────────────────────────────────────
    ubuntu_servers:
      hosts:
        ubuntu-web-01:
          ansible_host: 192.168.1.10
        ubuntu-web-02:
          ansible_host: 192.168.1.11
        ubuntu-db-01:
          ansible_host: 192.168.1.20
          patch_criticality: high
      vars:
        ansible_user: ansible
        ansible_python_interpreter: /usr/bin/python3

    # ─── Rocky Linux ────────────────────────────────────────────────────
    rocky_servers:
      hosts:
        rocky-app-01:
          ansible_host: 192.168.1.30
        rocky-app-02:
          ansible_host: 192.168.1.31
      vars:
        ansible_user: ansible
        ansible_python_interpreter: /usr/bin/python3

    # ─── macOS ──────────────────────────────────────────────────────────
    macos_servers:
      hosts:
        mac-build-01:
          ansible_host: 192.168.1.50
        mac-build-02:
          ansible_host: 192.168.1.51
      vars:
        ansible_user: admin
        # Requires the Xcode Command Line Tools (provides /usr/bin/python3)
        ansible_python_interpreter: /usr/bin/python3

    # ─── Windows 10 / 11 ────────────────────────────────────────────────
    # Windows 10 only gets security updates when enrolled in ESU.
    windows_servers:
      hosts:
        # ansible_host: a name the listener certificate is made for
        # (setup_winrm.ps1 -DnsNames). With an IP address it can't be validated.
        win-desktop-01:
          ansible_host: win-desktop-01.example.lan
        win-desktop-02:
          ansible_host: win-desktop-02.example.lan
        win-server-01:
          ansible_host: win-server-01.example.lan
          patch_criticality: high
      vars:
        ansible_user: ansible_admin
        ansible_password: "{{ vault_windows_password }}"
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_scheme: https
        # Kerberos is preferable in a domain (pip install pywinrm[kerberos]).
        ansible_winrm_transport: ntlm
        # Validate the listener certificate. setup_winrm.ps1 makes a
        # self-signed one and exports it to C:\ProgramData\patch-manager\
        # winrm-<COMPUTERNAME>.pem: copy each one to inventory/winrm-ca/<host>.pem.
        # With certificates from your CA, point this at the CA instead.
        # "ignore" also works, but then anyone in the middle of the network
        # can impersonate the host and relay the NTLM exchange.
        ansible_winrm_server_cert_validation: validate
        ansible_winrm_ca_trust_path: "{{ inventory_dir }}/winrm-ca/{{ inventory_hostname }}.pem"

    # ─── Hosts that must never reboot on their own ──────────────────────
    # LXD/VM hosts (a reboot stops their guests) and the host that runs
    # Semaphore. List them here as well as in their OS group.
    # no_auto_reboot:
    #   hosts:
    #     lxd-host-01:
    #   vars:
    #     patch_reboot_blocked: true

    # ─── Hosts with Docker Compose projects (docker_update.yml) ─────────
    # One entry per host, listing the directories that hold a compose file.
    # docker_hosts:
    #   hosts:
    #     photos-01:
    #       docker_compose_projects: [/root/immich]
    #       docker_wait_retries: 40   # slow starters: 40 x 15 s = 10 min

    # ─── ISPConfig hosts (ispconfig_check.yml, ispconfig_update.yml) ────
    # Also in ubuntu_servers. release_upgrade.yml refuses them unless the
    # host has patch_release_upgrade_blocked: false.
    # ispconfig_servers:
    #   hosts:
    #     web-01:

    # ─── Hosts that run in LXD ──────────────────────────────────────────
    # ispconfig_update.yml and release_upgrade.yml take an LXD snapshot first
    # and restore it if the change fails. They need to know where the host
    # runs: lxd_host is the inventory name of the LXD host (reached over SSH,
    # with sudo), lxd_instance the LXD name when it isn't the inventory name
    # in lowercase. Per host, e.g.:
    #     web-01:
    #       ansible_host: 192.168.1.40
    #       lxd_host: lxd-host-01
    #       lxd_instance: web01

    # ─── Logical groups (scheduling, --limit) ───────────────────────────
    production:
      children:
        ubuntu_servers:
        rocky_servers:

    workstations:
      children:
        macos_servers:
        windows_servers:
