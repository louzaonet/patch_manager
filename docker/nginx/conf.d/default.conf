# =============================================================================
# Reverse proxy: Semaphore UI (/) and AI dashboard (/ai/) behind HTTPS
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Semaphore UI (websocket for live task output)
    location / {
        proxy_pass http://semaphore:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI dashboard + API (the app uses relative URLs, so stripping /ai/ works).
    # Analyses can take a while: LLM calls plus throttled NVD lookups.
    location /ai/ {
        proxy_pass http://patch-ai:8501/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Only the real client address. The AI service runs uvicorn with
        # --forwarded-allow-ips "*", which takes the leftmost X-Forwarded-For
        # entry; appending would let a client pick its own address and get
        # around the failed-login throttle.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Optional: restrict to LAN / VPN ranges
        # allow 192.168.1.0/24; allow 100.64.0.0/10; deny all;
    }

    location = /health {
        proxy_pass http://patch-ai:8501/api/health;
        access_log off;
    }

    location ~ /\.(git|env|htaccess|htpasswd) {
        return 404;
    }
}
