# Patch Manager: nginx in front of Semaphore (/) and the AI service (/ai/)
# Replace the self-signed certificate with a real one (ACME/Actalis, internal CA).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" works on Ubuntu 24.04's nginx 1.24; newer nginx
    # prefers a separate "http2 on;" but still accepts this form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/patch-manager/server.crt;
    ssl_certificate_key /etc/ssl/patch-manager/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:PM_SSL:10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    # Semaphore UI (websocket for live task output)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # AI dashboard and API. Analyses can take a while (LLM + NVD lookups).
    location /ai/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Optional: restrict to your LAN / VPN
        # allow 192.168.1.0/24; allow 100.64.0.0/10; deny all;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8501/api/health;
        access_log off;
    }
}
